name: Fetch news into D1

# Google News blocks RSS requests made from Cloudflare Workers, so the
# news feed is collected here, on a GitHub-hosted runner, and written to
# the shared D1 database (`news_items`). The first run backfills the last
# 8 days; every later run only appends what's new (INSERT OR IGNORE on the
# unique url). The scheduler Worker then reads news_items as evidence for
# its hourly classification, and the site shows it on / and /news.
on:
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "8"

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Also translates new non-English headlines with Workers AI, so the
      # token needs "Workers AI: Read" on top of D1 access (see
      # DEPLOYMENT.md, "News feed").
      - name: Collect headlines, upsert into D1, translate
        run: node scripts/fetch-news.ts --days=${{ github.event.inputs.days || '8' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
