name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TYPESAFE_AI_KEY: ${{ secrets.TYPESAFE_AI_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck + build
        run: npm run build

      - name: Apply D1 migrations (idempotent)
        run: npx wrangler d1 migrations apply ispolandsafenow-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Google blocks RSS fetches from Workers, so news is collected here
      # (see .github/workflows/fetch-news.yml for the recurring run) —
      # done before the classification trigger below so that run has
      # evidence to work with. Also translates new headlines with Workers
      # AI (token needs "Workers AI: Read"). Best-effort: Google News
      # occasionally rate-limits/blocks a GitHub-hosted runner's IP and
      # the script then exits non-zero on zero collected items — that must
      # not block the actual site deploy below, since the recurring
      # fetch-news.yml workflow retries every 2 hours regardless.
      - name: Fetch news into D1
        run: node scripts/fetch-news.ts
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy scheduler Worker
        id: deploy_scheduler
        run: |
          set -euo pipefail
          npx wrangler deploy --config scheduler/wrangler.jsonc | tee /tmp/scheduler-deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/scheduler-deploy.log | head -n1)
          if [ -z "$url" ]; then
            echo "Could not determine the scheduler Worker's URL from deploy output." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set the TypeSafe AI key on the scheduler (if configured)
        if: ${{ env.HAS_TYPESAFE_AI_KEY == 'true' }}
        run: printf '%s' "$TYPESAFE_AI_API_KEY" | npx wrangler secret put TYPESAFE_AI_API_KEY --config scheduler/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}

      - name: Trigger an immediate classification run
        run: |
          set -euo pipefail
          trigger_secret=$(openssl rand -hex 32)
          echo "::add-mask::$trigger_secret"
          printf '%s' "$trigger_secret" | npx wrangler secret put SCHEDULER_TRIGGER_SECRET --config scheduler/wrangler.jsonc

          http_status=$(curl -sS -o /tmp/trigger-response.json -w '%{http_code}' -X POST \
            "${{ steps.deploy_scheduler.outputs.url }}/trigger" \
            -H "x-trigger-secret: $trigger_secret")
          echo "Trigger response (HTTP $http_status):"
          cat /tmp/trigger-response.json
          echo
          if [ "$http_status" != "200" ]; then
            echo "Classification job did not succeed — see the response above (e.g. TYPESAFE_AI_API_KEY not yet configured)." >&2
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
